#--------------------------------------------------------------------------
# Configuration
#--------------------------------------------------------------------------

# Use Vi mode
setw -g mode-keys vi

# Increase scrollback buffer size
set -g history-limit 10000

# Start window and pane numbering from 1 for easier switching
set -g base-index 1
setw -g pane-base-index 1

# Allow automatic renaming of windows
set -g allow-rename on

# Renumber windows when one is removed.
set -g renumber-windows on

# Improve colors
set -g default-terminal "${TERM}"

# Enable undercurl
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'

# Enable undercurl colors
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Allow the mouse to resize windows and select tabs
set -g mouse on

# Allow tmux to set the terminal title
set -g set-titles on

# Monitor window activity to display in the status bar
setw -g monitor-activity on

# A bell in another window should cause a bell in the current window
set -g bell-action any

# Don't show distracting notifications
set -g visual-bell off
set -g visual-activity off

# Focus events enabled for terminals that support them
set -g focus-events on

# Useful when using sharing a session with different size terminals
setw -g aggressive-resize on

# don't detach tmux when killing a session
set -g detach-on-destroy off

# address vim mode switching delay (http://superuser.com/a/252717/65504)
set -s escape-time 0

#--------------------------------------------------------------------------
# Status line
#--------------------------------------------------------------------------

# Status line customisation
#set-option -g status-left-length 100
#set-option -g status-right-length 100
#set-option -g status-left " #{session_name}  "
#set-option -g status-right "#{pane_title} "
#set-option -g status-style "fg=#7C7D83 bg=#242631"
#set-option -g window-status-format "#{window_index}:#{pane_current_command}#{window_flags} "
#set-option -g window-status-current-format "#{window_index}:#{pane_current_command}#{window_flags} "
#set-option -g window-status-current-style "fg=#E9E9EA"
#set-option -g window-status-activity-style none

# Theme. `install` links the right tmux/theme.<platform> variant here: fixed
# hex on most machines, ANSI names on Omarchy so omarchy-theme-set applies.
source-file -q ~/.tmux.theme.conf

# Key Bindings
#--------------------------------------------------------------------------

# -r means that the bind can repeat without entering prefix again
# -n means that the bind doesn't use the prefix

# Set the prefix to Ctrl+Space
set -g prefix C-Space

# Send prefix to a nested tmux session by doubling the prefix
bind -N "Send prefix to a nested session" C-Space send-prefix

# 'PREFIX r' to reload of the config file
unbind r
bind -N "Reload tmux config" r source-file ~/.tmux.conf\; display-message '~/.tmux.conf reloaded'

# Allow holding Ctrl when using using prefix+p/n for switching windows
bind -N "Previous window" C-p previous-window
bind -N "Next window" C-n next-window

# Move between windows like in vim
bind -N "Previous window" -r C-h select-window -t :-
bind -N "Next window" -r C-l select-window -t :+

# Switch between previous and next windows with repeatable
bind -N "Next window" -r n next-window
bind -N "Previous window" -r p previous-window

# Move the current window to the next window or previous window position
bind -N "Move window right" -r N run-shell "tmux swap-window -t $(expr $(tmux list-windows | grep \"(active)\" | cut -d \":\" -f 1) + 1)"
bind -N "Move window left" -r P run-shell "tmux swap-window -t $(expr $(tmux list-windows | grep \"(active)\" | cut -d \":\" -f 1) - 1)"

# Switch between two most recently used windows
bind -N "Last window" Space last-window

# Switch between two most recently used sessions
bind -N "Last session" ^ switch-client -l

# use PREFIX+| (or PREFIX+\) to split window horizontally and PREFIX+- or
# (PREFIX+_) to split vertically also use the current pane path to define the
# new pane path
bind -N "Split right" "|" split-window -h -c "#{pane_current_path}"
bind -N "Split right, full height" "\\" split-window -fh -c "#{pane_current_path}"

bind -N "Split below" "-" split-window -v -c "#{pane_current_path}"
bind -N "Split below, full width" "_" split-window -fv -c "#{pane_current_path}"

# Window Swapping
bind -N "Swap window left" -r "<" swap-window -d -t -1
bind -N "Swap window right" -r ">" swap-window -d -t +1

# Change the path for newly created windows
bind -N "New window in current path" c new-window -c "#{pane_current_path}"

# Break pane into it's own window
# Prefix + !

# Setup 'v' to begin selection as in Vim
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Copy the tmux buffer to the system clipboard with whichever tool this OS has:
# pbcopy on macOS, wl-copy on Wayland (Omarchy), xclip on X11
bind -N "Copy tmux buffer to clipboard" y run-shell -b ' \
    if command -v pbcopy >/dev/null 2>&1; then c="pbcopy"; \
    elif [ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy >/dev/null 2>&1; then c="wl-copy"; \
    elif command -v xclip >/dev/null 2>&1; then c="xclip -selection clipboard"; \
    else tmux display-message "No clipboard tool found (pbcopy, wl-copy, xclip)"; exit 0; fi; \
    tmux show-buffer | $c && tmux display-message "Copied tmux buffer to system clipboard"'

bind-key -N "New window running t" -r F new-window t
bind-key -N "Run t in ~/.dotfiles" -r D run-shell "t ~/.dotfiles"

# Toggle mouse mode with Prefix+m
bind -N "Toggle mouse mode" m set -g mouse\; display-message "Mouse #{?mouse,on,off}"

# Project jump popup (prefix j) - fzf through ~/code projects
bind -N "Jump to project" j display-popup -E -w 60% -h 60% "tmux-project-jump"

# Session switcher popup (prefix J) - fzf through existing sessions
bind -N "Switch session" J display-popup -E -w 60% -h 60% "tmux-session-switch"

# Key binding reference popup (prefix ?) - fzf through active bindings
bind -N "Search key bindings" ? display-popup -E -w 80% -h 80% "tmux-keys"

# Open scratch pad
bind-key -N "Open scratch pad" h split-window -fh -c "~" "nvim ~/notes.md"

# Save the pane's full scrollback to a timestamped file (prefix S)
bind -N "Save pane scrollback to a file" S run-shell \
    'f="$HOME/tmux-#S-#I-#P-$(date +%Y%m%d-%H%M%S).log"; tmux capture-pane -J -p -S - -t "#{pane_id}" > "$f" && tmux display-message "Saved scrollback to $f"'

# Toggle live logging of the pane to a file (prefix L)
bind -N "Toggle pane logging to a file" L if-shell -F "#{pane_pipe}" \
    'pipe-pane; display-message "Stopped logging pane"' \
    'pipe-pane -o "cat >> $HOME/tmux-#S-#I-#P.log"; display-message "Logging pane to ~/tmux-#S-#I-#P.log"'
