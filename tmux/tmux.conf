#--------------------------------------------------------------------------
# Configuration
#--------------------------------------------------------------------------

# Use Vi mode
setw -g mode-keys vi

# Increase scrollback buffer size
set -g history-limit 10000

# Start window and pane numbering from 1 for easier switching
set -g base-index 1
setw -g pane-base-index 1

# Allow automatic renaming of windows
set -g allow-rename on

# Renumber windows when one is removed.
set -g renumber-windows on

# Improve colors
set -g default-terminal "${TERM}"

# Enable undercurl
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'

# Enable undercurl colors
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Allow the mouse to resize windows and select tabs
set -g mouse on

# Allow tmux to set the terminal title
set -g set-titles on

# Monitor window activity to display in the status bar
setw -g monitor-activity on

# A bell in another window should cause a bell in the current window
set -g bell-action any

# Don't show distracting notifications
set -g visual-bell off
set -g visual-activity off

# Focus events enabled for terminals that support them
set -g focus-events on

# Useful when using sharing a session with different size terminals
setw -g aggressive-resize on

# don't detach tmux when killing a session
set -g detach-on-destroy off

# address vim mode switching delay (http://superuser.com/a/252717/65504)
set -s escape-time 0

#--------------------------------------------------------------------------
# Status line
#--------------------------------------------------------------------------

# Status line customisation
#set-option -g status-left-length 100
#set-option -g status-right-length 100
#set-option -g status-left " #{session_name}  "
#set-option -g status-right "#{pane_title} "
#set-option -g status-style "fg=#7C7D83 bg=#242631"
#set-option -g window-status-format "#{window_index}:#{pane_current_command}#{window_flags} "
#set-option -g window-status-current-format "#{window_index}:#{pane_current_command}#{window_flags} "
#set-option -g window-status-current-style "fg=#E9E9EA"
#set-option -g window-status-activity-style none

# Nord Light Brighter. Hex values are used rather than the ANSI names so the
# status line stays put if the terminal palette is ever swapped.
setw -g clock-mode-colour '#1155a3'
setw -g mode-style 'fg=#24292e bg=#c2d9f5 bold'

# One flat divider. tmux paints the border segments touching the active pane
# with pane-active-border-style, which is what splits a single divider into two
# colours; matching the two styles makes it a solid line.
set -g pane-border-style 'fg=#d6d6d6'
set -g pane-active-border-style 'fg=#d6d6d6'

# Focus is shown by dimming the background of unfocused panes instead.
set -g window-style 'bg=#f6f8fa'
set -g window-active-style 'bg=#ffffff'

set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=#474b4f bg=#ebebeb'

set -g status-left-style 'fg=#0d5c43 bold'
set -g status-left ' #h:#S '
set -g status-left-length 100

set -g status-right-style 'fg=#8995a0'
set -g status-right ' #{?mouse,#[fg=#50750e]M,#[fg=#f93232]M}#[fg=#8995a0] %Y-%m-%d %H:%M '
set -g status-right-length 50

setw -g window-status-current-style 'fg=#1155a3 bold'
setw -g window-status-current-format ' #I:#W '

setw -g window-status-style 'fg=#8995a0'
setw -g window-status-format ' #I:#W '

setw -g window-status-bell-style 'fg=#e36209 bold'

setw -g window-status-separator ""

set -g message-style 'fg=#ffffff bg=#e36209'

# Key Bindings
#--------------------------------------------------------------------------

# -r means that the bind can repeat without entering prefix again
# -n means that the bind doesn't use the prefix

# Set the prefix to Ctrl+Space
set -g prefix C-Space

# Send prefix to a nested tmux session by doubling the prefix
bind C-Space send-prefix

# 'PREFIX r' to reload of the config file
unbind r
bind r source-file ~/.tmux.conf\; display-message '~/.tmux.conf reloaded'

# Allow holding Ctrl when using using prefix+p/n for switching windows
bind C-p previous-window
bind C-n next-window

# Move around panes like in vim
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Switch between previous and next windows with repeatable
bind -r n next-window
bind -r p previous-window

# Move the current window to the next window or previous window position
bind -r N run-shell "tmux swap-window -t $(expr $(tmux list-windows | grep \"(active)\" | cut -d \":\" -f 1) + 1)"
bind -r P run-shell "tmux swap-window -t $(expr $(tmux list-windows | grep \"(active)\" | cut -d \":\" -f 1) - 1)"

# Switch between two most recently used windows
bind Space last-window

# Switch between two most recently used sessions
bind ^ switch-client -l

# use PREFIX+| (or PREFIX+\) to split window horizontally and PREFIX+- or
# (PREFIX+_) to split vertically also use the current pane path to define the
# new pane path
bind "|" split-window -h -c "#{pane_current_path}"
bind "\\" split-window -fh -c "#{pane_current_path}"

bind "-" split-window -v -c "#{pane_current_path}"
bind "_" split-window -fv -c "#{pane_current_path}"

# Window Swapping
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

# Change the path for newly created windows
bind c new-window -c "#{pane_current_path}"

# Break pane into it's own window
# Prefix + !

# Setup 'v' to begin selection as in Vim
if-shell -b '[ "$(echo "$TMUX_VERSION >= 2.4" | bc)" = 1 ]' \
    'bind-key -T copy-mode-vi v send-keys -X begin-selection;'

bind y run -b "tmux show-buffer | xclip -selection clipboard"\; display-message "Copied tmux buffer to system clipboard"

bind-key -r F new-window t
bind-key -r D run-shell "t ~/.dotfiles"

# Toggle mouse mode with Prefix+m
bind m set -g mouse\; display-message "Mouse #{?mouse,on,off}"

# Project jump popup (prefix j) - fzf through ~/code projects
bind j display-popup -E -w 60% -h 60% "tmux-project-jump"

# Session switcher popup (prefix J) - fzf through existing sessions
bind J display-popup -E -w 60% -h 60% "tmux-session-switch"

# Open scratch pad
bind-key h split-window -fh -c "~" "nvim ~/notes.md"
